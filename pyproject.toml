[project]
name = "tally"
version = "0.1.0"
description = "Split shared expenses in a group and see who owes whom."
requires-python = ">=3.10"

[project.scripts]
tally = "tally.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
